<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Activities</title>
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F5F5F7; --card:#FFFFFF; --fill:#F5F5F7; --fill-2:#EBEBF0;
  --text:#1D1D1F; --text-2:#6E6E73; --text-3:#86868B;
  --sep:#D2D2D7; --sep-2:#E8E8ED;
  --blue:#0066CC; --blue-solid:#0071E3; --green:#1D7F3C; --red:#C8102E; --orange:#B25000;
  --blue-bg:#EDF4FD; --green-bg:#EAF6EE; --red-bg:#FCEDEF; --orange-bg:#FDF3E8;
  --thumb:#FFFFFF; --r:18px; --r-sm:12px;
  --shadow:0 4px 20px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 18px 46px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05);
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-2:#101012; --card:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C;
    --thumb:#48484A;
    --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#8E8E93;
    --sep:#38383A; --sep-2:#2C2C2E;
    --blue:#2997FF; --blue-solid:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
    --blue-bg:#0D2136; --green-bg:#0E2A18; --red-bg:#2E1113; --orange-bg:#2C1E06;
    --shadow:0 4px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 18px 46px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#101012; --card:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C;
    --thumb:#48484A;
  --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#8E8E93;
  --sep:#38383A; --sep-2:#2C2C2E;
  --blue:#2997FF; --blue-solid:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --blue-bg:#0D2136; --green-bg:#0E2A18; --red-bg:#2E1113; --orange-bg:#2C1E06;
  --shadow:0 4px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 18px 46px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0; -webkit-text-size-adjust:100%}
html{min-height:100%}
button{touch-action:manipulation}
body{background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
code,pre,.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0}
button,input,textarea{font-family:inherit; letter-spacing:inherit}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.022em}

.wrap{max-width:1120px; margin:0 auto; padding:34px 22px 60px; min-height:100vh;
  min-height:100dvh; display:flex; flex-direction:column}
.tabbody{margin-block:auto; width:100%}
@media (max-width:640px){ .wrap{padding:18px 16px 40px} }

.topline{display:flex; align-items:center; justify-content:space-between; gap:18px;
  flex-wrap:wrap; margin-bottom:30px}
.masthead{margin-bottom:30px}
h1{font-size:44px; line-height:1.08; letter-spacing:-.03em}
@media (max-width:640px){ h1{font-size:32px} }
.lede{color:var(--text-2); max-width:62ch; font-size:18px; margin:14px 0 0; line-height:1.45}
@media (max-width:640px){ .lede{font-size:16px} }

.ghostpill{border:1px solid var(--sep); background:transparent; color:var(--text-2);
  border-radius:980px; padding:7px 15px; font-size:13px; cursor:pointer; font-weight:500;
  transition:background .2s var(--ease), color .2s var(--ease)}
.ghostpill:hover{background:var(--fill); color:var(--text)}

/* segmented control */
.seg-wrap{margin:0}
.segmented{display:inline-flex; position:relative; background:var(--fill); border-radius:11px; padding:3px;
  gap:0}
.segmented button{position:relative; z-index:1; appearance:none; border:none; background:none;
  padding:8px 20px; font-size:14px; font-weight:500; color:var(--text-2); cursor:pointer;
  border-radius:9px; transition:color .25s var(--ease)}
.segmented button[aria-selected="true"]{color:var(--text); font-weight:600}
.segmented .thumb{position:absolute; top:3px; bottom:3px; background:var(--thumb); border-radius:9px;
  box-shadow:0 2px 6px rgba(0,0,0,.09), 0 0 0 .5px rgba(0,0,0,.04);
  transition:left .34s var(--ease), width .34s var(--ease)}

/* generic surfaces */
.card{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.card-h{padding:15px 20px 13px; border-bottom:1px solid var(--sep-2);
  display:flex; align-items:center; justify-content:space-between; gap:12px}
.card-h .t{font-size:15px; font-weight:600}
.card-h .n{font-size:14px; color:var(--text-3); font-variant-numeric:tabular-nums}
.card-b{padding:20px}

.btn{appearance:none; border:none; border-radius:980px; padding:11px 22px; font-size:15px;
  font-weight:500; cursor:pointer; background:var(--blue-solid); color:#fff;
  transition:transform .18s var(--ease), opacity .2s var(--ease), background .2s var(--ease)}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35; cursor:default; transform:none}
.btn.sub{background:var(--fill); color:var(--text)}
.btn.sub:hover{background:var(--fill-2); opacity:1}
.btn.go{background:var(--green); color:#fff}
.btn.sm{padding:8px 16px; font-size:13.5px}
.btn:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

input[type=text]{width:100%; font-size:15px; padding:11px 14px; border:1px solid var(--sep);
  border-radius:var(--r-sm); background:var(--bg); color:var(--text); transition:border-color .2s}
input[type=text]:focus{outline:none; border-color:var(--blue-solid); box-shadow:0 0 0 3px var(--blue-bg)}
.mono-in{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:14px; letter-spacing:0}

.hint{font-size:13px; color:var(--text-3); line-height:1.5}

@keyframes riseIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.rise{animation:riseIn .45s var(--ease) both}

/* ---------- tab 1 ---------- */
.layout{display:grid; grid-template-columns:296px 1fr; gap:24px; align-items:start}
@media (max-width:920px){ .layout{grid-template-columns:1fr} }
@media (max-width:640px){
  h1{font-size:28px}
  .dash{padding:14px}
  .tile .val{font-size:21px}
  .bars{height:80px}
  .drow{font-size:13px; padding:10px 12px}
  .inrow input{flex:1 1 100%}
  .inrow .btn{flex:1 1 auto}
  .topline{margin-bottom:20px}
  .segmented button{padding:8px 14px; font-size:13.5px}
}

.faults{list-style:none; margin:0; padding:6px}
.fault{display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:none;
  background:none; color:var(--text); padding:11px 12px; border-radius:var(--r-sm); cursor:pointer;
  transition:background .2s var(--ease)}
.fault:hover{background:var(--fill)}
.fault[aria-pressed="true"]{background:var(--blue-bg)}
.fault .num{width:22px; height:22px; flex:none; border-radius:50%; background:var(--fill-2);
  color:var(--text-2); font-size:11.5px; font-weight:600; display:flex; align-items:center;
  justify-content:center; font-variant-numeric:tabular-nums; transition:all .25s var(--ease)}
.fault[aria-pressed="true"] .num{background:var(--blue-solid); color:#fff}
.fault.done .num{background:var(--green); color:#fff}
.fault .txt{min-width:0; text-align:left}
.fault .lab{font-size:14px; line-height:1.3; display:block}
.fault .kind{font-size:12px; color:var(--text-3); display:block; margin-top:2px}
.fault:focus-visible{outline:2px solid var(--blue); outline-offset:-2px}

.bar{height:4px; border-radius:99px; background:var(--fill-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--green); border-radius:99px;
  transition:width .5s var(--ease)}

.screen{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow-lg); overflow:hidden}
.chrome{display:flex; align-items:center; gap:7px; padding:12px 18px; border-bottom:1px solid var(--sep-2)}
.tl{width:11px;height:11px;border-radius:50%;background:var(--sep);flex:none}
.fname{font-size:13px; color:var(--text-3); margin-left:8px; font-family:ui-monospace,Menlo,monospace;
  letter-spacing:0; transition:color .3s}
.fname.bad{color:var(--red)}

.dash{padding:24px}
@media (max-width:640px){ .dash{padding:18px} }
.dash-h{display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap;
  margin-bottom:20px}
.shopname{font-size:24px; font-weight:600; letter-spacing:-.022em; transition:color .3s}
.shopname.bad{color:var(--red)} .shopname.off{color:var(--text-3)}
.week{font-size:13.5px; color:var(--text-3)}

.tiles{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px}
@media (max-width:820px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tile{background:var(--fill); border-radius:var(--r-sm); padding:15px 16px;
  transition:background .3s var(--ease), opacity .3s var(--ease)}
.tile.lie{background:var(--red-bg)}
.tile.dead{opacity:.32}
.tile .lab{font-size:13px; color:var(--text-2)}
.tile .val{font-size:24px; font-weight:600; letter-spacing:-.025em; margin-top:4px;
  font-variant-numeric:tabular-nums; word-break:break-word; line-height:1.15}
.tile.lie .val{color:var(--red)}
.tile .sub{font-size:12.5px; color:var(--text-3); margin-top:3px}
.tile.lie .sub{color:var(--red)}

.chartbox{margin-top:12px; background:var(--fill); border-radius:var(--r-sm); padding:16px 18px 12px;
  transition:opacity .3s var(--ease)}
.chartbox.dead{opacity:.32}
.chartbox .ct{font-size:13px; color:var(--text-2); margin-bottom:14px}
.bars{display:flex; align-items:flex-end; gap:12px; height:104px}
.bcol{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px;
  height:100%}
.bcol .b{width:100%; background:var(--blue-solid); border-radius:6px 6px 2px 2px; min-height:3px;
  transition:height .45s var(--ease), background .3s}
.bcol.dead .b{background:var(--sep)}
.bcol .n{font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums}
.bcol .d{font-size:12px; color:var(--text-2)}

.rowbox{margin-top:12px; background:var(--fill); border-radius:var(--r-sm); overflow:hidden}
.drow{display:flex; justify-content:space-between; gap:12px; padding:12px 16px; font-size:14px;
  border-bottom:1px solid var(--sep-2); transition:background .3s var(--ease), opacity .3s var(--ease)}
.drow:last-child{border-bottom:none}
.drow .k{color:var(--text-2)}
.drow .v{font-variant-numeric:tabular-nums; font-weight:500}
.drow.lie{background:var(--red-bg)}
.drow.lie .k,.drow.lie .v{color:var(--red)}
.drow.dead{opacity:.32}

.banner{margin-top:16px; border-radius:var(--r-sm); padding:14px 16px; animation:riseIn .4s var(--ease) both}
.banner.bad{background:var(--red-bg)}
.banner.ok{background:var(--green-bg)}
.banner.warn{background:var(--orange-bg)}
.banner.warn .h{color:var(--orange)}
.banner.warn pre{color:var(--orange)}
.banner .h{font-size:13px; font-weight:600; color:var(--red)}
.banner pre{margin:7px 0 0; font-size:12.5px; color:var(--red); white-space:pre-wrap;
  word-break:break-word; line-height:1.5}
.banner.ok p{margin:0; font-size:14px; color:var(--text-2)}

.explain{margin-top:24px; display:grid; gap:14px}
.srcbox .l{font-size:13px; color:var(--text-2); margin-bottom:8px}
pre.code{margin:0; background:var(--fill); border-radius:var(--r-sm); padding:16px 18px;
  font-size:13.5px; line-height:1.65; overflow-x:auto; white-space:pre}
.note{border-radius:var(--r-sm); padding:16px 18px}
.note .h{font-size:13px; font-weight:600; margin-bottom:5px}
.note p{margin:0; font-size:15px; line-height:1.55}
.note.breaks{background:var(--red-bg)} .note.breaks .h{color:var(--red)}
.note.why{background:var(--orange-bg)} .note.why .h{color:var(--orange)}
.note.fix{background:var(--green-bg)} .note.fix .h{color:var(--green)}

.repair{background:var(--fill); border-radius:var(--r); padding:20px}
.opts{display:grid; gap:9px; margin-top:12px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  background:var(--card); border:1px solid transparent; border-radius:var(--r-sm);
  padding:12px 14px; cursor:pointer; color:var(--text);
  transition:border-color .2s var(--ease), background .25s var(--ease), transform .15s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--sep)}
.opt:active:not(:disabled){transform:scale(.995)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green-bg); border-color:var(--green)}
.opt.wrong{background:var(--red-bg); border-color:var(--red)}
.opt .ltr{flex:none; width:22px; height:22px; border-radius:50%; background:var(--fill-2);
  color:var(--text-2); font-size:11.5px; font-weight:600; display:flex; align-items:center;
  justify-content:center; margin-top:1px}
.opt.right .ltr{background:var(--green); color:#fff}
.opt.wrong .ltr{background:var(--red); color:#fff}
.opt .optcode{margin:0; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:13.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word; flex:1}
.feedback{margin-top:10px; font-size:14px; line-height:1.55; border-left:3px solid var(--sep);
  padding-left:12px; color:var(--text-2); animation:riseIn .35s var(--ease) both}
.feedback b{font-weight:600}
.feedback.ok{border-left-color:var(--green)} .feedback.ok b{color:var(--green)}
.feedback.no{border-left-color:var(--red)} .feedback.no b{color:var(--red)}
.solved{margin-top:12px; font-size:14px; color:var(--green); font-weight:500}
.repair .btn.sub{background:var(--card)}
.repair .btn.sub:hover{background:var(--fill-2)}
.repair .l{font-size:14px; font-weight:600; margin-bottom:10px; display:block}
.inrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.inrow input{flex:1 1 280px}
.verdict{margin-top:11px; font-size:14px; animation:fadeIn .3s both}
.verdict.no{color:var(--red)}
.verdict.yes{color:var(--green); font-weight:500}
.showme{margin-top:11px; font-size:14px; color:var(--text-2)}
.showme code{background:var(--card); border-radius:7px; padding:3px 8px; font-size:13px}
.blank{padding:44px 20px; text-align:center; color:var(--text-3); font-size:15px}

/* ---------- tab 2 ---------- */
.deckwrap{display:grid; grid-template-columns:1fr 268px; gap:28px; align-items:start}
@media (max-width:920px){ .deckwrap{grid-template-columns:1fr} }

.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px}
@media (max-width:760px){
  .chips{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
    margin:0 -16px 16px; padding:2px 16px 6px; scroll-snap-type:x proximity}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none; scroll-snap-align:start}
}
.chip{appearance:none; border:1px solid var(--sep); background:transparent; color:var(--text-2);
  border-radius:980px; padding:7px 15px; font-size:13.5px; cursor:pointer; font-weight:500;
  transition:all .22s var(--ease)}
.chip:hover{background:var(--fill); color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text); color:var(--bg); border-color:var(--text)}

.stage{position:relative; perspective:1800px}
.stack{position:absolute; inset:0; border-radius:22px; background:#14663A; box-shadow:var(--shadow)}
.stack.s1{transform:translateY(11px) scale(.965); opacity:.55}
.stack.s2{transform:translateY(22px) scale(.93); opacity:.3}

.swap{position:relative; width:100%}
.flip{display:grid; width:100%; min-height:432px; touch-action:pan-y; transform-style:preserve-3d;
  transition:transform .62s var(--ease); cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1; position:relative; backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:var(--card); border-radius:22px; box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column}
.face > *{flex:none}
.face.back{transform:rotateY(180deg) translateZ(0)}

.front{align-items:center; justify-content:center; text-align:center; padding:40px 32px; gap:22px;
  background:linear-gradient(158deg, #23955A 0%, #14663A 65%); color:#FFFFFF;
  box-shadow:0 22px 50px rgba(15,70,40,.26), 0 2px 8px rgba(0,0,0,.10)}
.front .grp{color:rgba(255,255,255,.80)}
.front .tap{color:rgba(255,255,255,.62)}
.front .badge{background:rgba(255,255,255,.17); color:#FFFFFF}
.grp{font-size:13px; font-weight:600; color:var(--blue)}
.term{font-size:46px; font-weight:600; letter-spacing:-.03em; line-height:1.08; word-break:break-word}
@media (max-width:640px){ .term{font-size:34px} }
.term .mono{font-size:.88em}
.tap{font-size:13.5px; color:var(--text-3)}
.badge{display:inline-block; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  letter-spacing:0; font-size:17px; background:var(--fill); color:var(--text-2);
  border-radius:10px; padding:7px 15px; white-space:pre}
.back .badge{font-size:14px; padding:5px 11px; margin-top:6px}

.back{padding:30px 32px 32px; gap:0}
@media (max-width:640px){
  .back,.front{padding:24px 20px}
  .flip{min-height:360px}
  .back .term{font-size:24px}
  .back .defn{font-size:16px; margin:12px 0 16px}
  .back pre.code{font-size:12.5px; padding:13px 14px}
  .like{font-size:14px}
  .stack.s1{transform:translateY(8px) scale(.97)}
  .stack.s2{transform:translateY(16px) scale(.945)}
}
.back .term{font-size:29px; text-align:left}
.back .defn{font-size:17.5px; line-height:1.5; color:var(--text); margin:14px 0 20px; max-width:56ch}
.back pre.code{background:var(--fill); font-size:13.5px; line-height:1.75}
.res{color:var(--green)}
.errline{color:var(--red)}
.like{margin-top:20px; padding-top:18px; border-top:1px solid var(--sep-2); font-size:15px;
  color:var(--text-2); line-height:1.55}
.like b{color:var(--text); font-weight:600}

@keyframes inFromRight{from{opacity:0; transform:translateX(34px) scale(.97)} to{opacity:1; transform:none}}
@keyframes inFromLeft{from{opacity:0; transform:translateX(-34px) scale(.97)} to{opacity:1; transform:none}}
@keyframes outLeft{to{opacity:0; transform:translateX(-120px) rotate(-7deg) scale(.9)}}
@keyframes outRight{to{opacity:0; transform:translateX(120px) rotate(7deg) scale(.9)}}
.enter{animation:inFromRight .42s var(--ease) both}
.enterL{animation:inFromLeft .42s var(--ease) both}
.leaveL{animation:outLeft .38s var(--ease) both}
.leaveR{animation:outRight .38s var(--ease) both}

.deckrow{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center}
@media (max-width:640px){ .deckrow{grid-template-columns:minmax(0,1fr); gap:14px} }
.arrow{appearance:none; border:1px solid var(--sep); background:var(--card); color:var(--text);
  width:46px; height:46px; border-radius:50%; cursor:pointer; font-size:19px; line-height:1;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  transition:transform .18s var(--ease), background .2s var(--ease)}
.arrow:hover{background:var(--fill)}
.arrow:active{transform:scale(.92)}
.arrow:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
@media (max-width:640px){
  .arrowbar{display:flex; gap:12px; justify-content:center}
  .arrow{width:44px; height:44px}
}
.deckctrl{display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; align-items:center; justify-content:center}
.mobonly{display:none}
@media (max-width:640px){ .deskonly{display:none} .mobonly{display:flex} }
.keyhint{font-size:12.5px; color:var(--text-3); margin-top:26px}
.kbd{display:inline-block; background:var(--fill); border-radius:5px; padding:1px 6px; font-size:11.5px;
  font-family:ui-monospace,Menlo,monospace; border:1px solid var(--sep-2)}

.ringwrap{display:flex; align-items:center; gap:16px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:7; stroke-linecap:round}
.ring .track{stroke:var(--fill-2)}
.ring .fill{stroke:var(--green); transition:stroke-dashoffset .55s var(--ease)}

 key","d":"Assign to a key. If it is new the pair is added; if it already exists the old value is replaced without warning.","lines":[{"c":"price = {\"House\": 12.50}"},{"c":"price[\"Decaf\"] = 13.00"},{"c":"price[\"House\"] = 13.25"},{"c":"price","r":"{'House': 13.25, 'Decaf': 13.0}"}],"like":"Writing a new line in the directory, or writing over an old one."},{"g":"Dictionaries","t":"Looking up safely","d":"Looks a key up without raising. Give it a fallback and a missing key returns that instead of stopping the program.","lines":[{"c":"price = {\"House\": 12.50}"},{"c":"price.get(\"House\")","r":"12.5"},{"c":"price.get(\"Mocha\", 0.0)","r":"0.0"}],"like":"A search that returns 'nothing found' instead of shouting.","k":".get()"},{"g":"Dictionaries","t":"The three views","d":"The labels, the contents, and the pairs.","lines":[{"c":"price = {\"House\": 12.50, \"Decaf\": 13.00}"},{"c":"list(price.keys())","r":"['House', 'Decaf']"},{"c":"list(price.values())","r":"[12.5, 13.0]"},{"c":"list(price.items())","r":"[('House', 12.5), ('Decaf', 13.0)]"}],"like":"The index, the entries, and the whole directory.","k":".keys()   .values()   .items()"},{"g":"Dictionaries","t":"in checks the keys","d":"Checks the keys, never the values. Asking whether 12.50 is 'in' a price list gives False.","lines":[{"c":"price = {\"House\": 12.50}"},{"c":"\"House\" in price","r":"True"},{"c":"12.50 in price","r":"False"},{"c":"12.50 in price.values()","r":"True"}],"like":"Searching a phone book by name, not by number.","k":"in"},{"g":"Dictionaries","t":"How many pairs","d":"How many pairs it holds.","lines":[{"c":"price = {\"House\": 12.50, \"Sumatra\": 14.00, \"Decaf\": 13.00}"},{"c":"len(price)","r":"3"}],"like":"How many entries in the directory.","k":"len()"},{"g":"Dictionaries","t":"Removing a key","d":"Removes a key and hands back its value.","lines":[{"c":"price = {\"House\": 12.50, \"Decaf\": 13.00}"},{"c":"price.pop(\"Decaf\")","r":"13.0"},{"c":"price","r":"{'House': 12.5}"}],"like":"Tearing an entry out and keeping the slip.","k":".pop()"},{"g":"Arrays","t":"Numpy array","d":"A container built for numbers. Made with np.array() from a list, and every item must be the same type.","lines":[{"c":"import numpy as np"},{"c":"sales = np.array([62.50, 41.00, 88.75, 95.25, 81.00])"},{"c":"sales","r":"array([62.5 , 41.  , 88.75, 95.25, 81.  ])"}],"like":"A column in a spreadsheet, where every cell is the same kind of thing.","k":"np.array()"},{"g":"Arrays","t":"One type per array","d":"The one type an array holds. One quoted number in the list and numpy turns the whole array into text.","lines":[{"c":"import numpy as np"},{"c":"np.array([11, 9, 6]).dtype","r":"dtype('int64')"},{"c":"str(np.array([11, 9, \"6\"]).dtype)","r":"'<U21'"},{"c":"np.array([11, 9, \"6\"])","r":"array(['11', '9', '6'], dtype='<U21')"}],"like":"One handwritten entry in a numeric column, and the whole column is now text.","k":"dtype"},{"g":"Arrays","t":"Arithmetic on a whole array","d":"An operation applies to every item at once. This is the reason arrays exist.","lines":[{"c":"import numpy as np"},{"c":"sales = np.array([62.50, 41.00, 88.75])"},{"c":"sales * 2","r":"array([125. ,  82. , 177.5])"},{"c":"sales + 10","r":"array([72.5 , 51.  , 98.75])"}],"like":"Applying the same discount to every row in one stroke."},{"g":"Arrays","t":"Array summaries","d":"Total, average and largest, straight off the array.","lines":[{"c":"import numpy as np"},{"c":"sales = np.array([62.50, 41.00, 88.75, 95.25, 81.00])"},{"c":"sales.sum()","r":"np.float64(368.5)"},{"c":"round(float(sales.mean()), 2)","r":"73.7"},{"c":"sales.max()","r":"np.float64(95.25)"}],"like":"The summary row at the bottom of the column.","k":".sum()   .mean()   .max()"},{"g":"Arrays","t":"Comparing a whole array","d":"A comparison gives back an array of True and False, one per item.","lines":[{"c":"import numpy as np"},{"c":"sales = np.array([62.50, 41.00, 88.75])"},{"c":"sales > 60","r":"array([ True, False,  True])"}],"like":"Ticking every row that clears the threshold."},{"g":"Arrays","t":"Filtering with a condition","d":"Put the comparison inside square brackets and you get only the items that passed.","lines":[{"c":"import numpy as np"},{"c":"sales = np.array([62.50, 41.00, 88.75, 95.25, 81.00])"},{"c":"sales[sales > 60]","r":"array([62.5 , 88.75, 95.25, 81.  ])"},{"c":"len(sales[sales > 60])","r":"4"}],"like":"Pulling out only the rows the filter highlighted.","k":"a[a > 60]"},{"g":"Arrays","t":"Array or list","d":"A list can mix types and grows easily. An array holds one type and does arithmetic on everything at once.","lines":[{"c":"import numpy as np"},{"c":"[1, 2, 3] * 2","r":"[1, 2, 3, 1, 2, 3]"},{"c":"np.array([1, 2, 3]) * 2","r":"array([2, 4, 6])"}],"like":"A notepad versus a spreadsheet column."},{"g":"Arrays","t":"Slicing an array","d":"Same brackets and the same rule: start at a, stop before b.","lines":[{"c":"import numpy as np"},{"c":"sales = np.array([62.50, 41.00, 88.75, 95.25, 81.00])"},{"c":"sales[0:3]","r":"array([62.5 , 41.  , 88.75])"},{"c":"sales[-2:]","r":"array([95.25, 81.  ])"}],"like":"Taking Monday to Wednesday off the week.","k":"[a:b]"},{"g":"Conditionals","t":"The if statement","d":"Runs the indented block only when the condition is True. The colon and the indent are both required.","lines":[{"c":"bags = 26"},{"c":"if bags >= 20:\n    tier = \"Gold\""},{"c":"tier","r":"'Gold'"}],"like":"A rule on the wall: if this, then that.","k":"if"},{"g":"Conditionals","t":"The else branch","d":"What happens when the condition was False. There is nothing to test, so no condition follows it.","lines":[{"c":"bags = 6"},{"c":"if bags >= 20:\n    tier = \"Gold\"\nelse:\n    tier = \"Bronze\""},{"c":"tier","r":"'Bronze'"}],"like":"Otherwise, do this instead.","k":"else"},{"g":"Conditionals","t":"The elif branch","d":"A further test, checked only when everything above it was False. You may have as many as you like.","lines":[{"c":"bags = 14"},{"c":"if bags >= 20:\n    tier = \"Gold\"\nelif bags >= 10:\n    tier = \"Silver\"\nelse:\n    tier = \"Bronze\""},{"c":"tier","r":"'Silver'"}],"like":"The next question on the form, asked only if the last one was no.","k":"elif"},{"g":"Conditionals","t":"Order of the chain","d":"The chain stops at the first test that passes, so the hardest condition has to come first. Put >= 10 above >= 20 and nobody is ever Gold.","lines":[{"c":"bags = 26"},{"c":"if bags >= 10:\n    wrong = \"Silver\"\nelif bags >= 20:\n    wrong = \"Gold\""},{"c":"wrong","r":"'Silver'"},{"c":"if bags >= 20:\n    right = \"Gold\"\nelif bags >= 10:\n    right = \"Silver\""},{"c":"right","r":"'Gold'"}],"like":"Sorting post by narrowest rule first, or everything lands in the first tray."},{"g":"Conditionals","t":"Indentation","d":"The indent is what says which lines belong to the if. Python treats it as part of the grammar, not as decoration.","lines":[{"c":"bags = 26"},{"c":"if bags >= 20:\n    tier = \"Gold\"\n    note = \"counted\""},{"c":"tier","r":"'Gold'"},{"c":"note","r":"'counted'"}],"like":"The bullet points that sit under a heading."},{"g":"Conditionals","t":"Conditions with and / or","d":"Combine tests in one line. Brackets make the intention obvious and cost nothing.","lines":[{"c":"bags = 26"},{"c":"revenue = 368.50"},{"c":"if bags >= 20 and revenue >= 300:\n    tier = \"Gold\""},{"c":"tier","r":"'Gold'"}],"like":"Two boxes that must both be ticked before the discount applies."},{"g":"Conditionals","t":"A condition is just a boolean","d":"Whatever sits after if is evaluated to True or False first. You can print it on its own to see what the if will see.","lines":[{"c":"bags = 26"},{"c":"bags >= 20","r":"True"},{"c":"bags >= 20 and bags < 30","r":"True"}],"like":"Reading the question out loud before you answer it."},{"g":"Loops","t":"The for loop","d":"Walks through a collection one item at a time, running the indented block once for each.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"for v in sales[:3]:\n    print(v)","r":"62.5 · 41.0 · 88.75"}],"like":"Going down a list of orders and doing the same thing to each one.","k":"for"},{"g":"Loops","t":"The loop variable","d":"The name after for holds one item at a time. It is not the collection, and it does not survive as anything special afterwards.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"for v in sales[:3]:\n    pass"},{"c":"v","r":"88.75"},{"c":"sales[:3]","r":"[62.5, 41.0, 88.75]"}],"like":"The parcel currently in your hands, not the whole trolley.","k":"for v in …"},{"g":"Loops","t":"Indentation decides what repeats","d":"Lines indented under the for run every pass. Lines level with it run once, after the loop is finished.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"n = 0\nfor v in sales:\n    n = n + 1\nprint(\"inside ran\", n, \"times\")","r":"inside ran 5 times"},{"c":"n = 0\nfor v in sales:\n    pass\nn = n + 1\nprint(\"outside ran\", n, \"time\")","r":"outside ran 1 time"}],"like":"Bullet points under a heading, versus the paragraph after it.","k":"    "},{"g":"Loops","t":"Building up a total","d":"Start the total outside the loop, add to it inside. This is the pattern behind nearly every sum you will write.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"total = 0\nfor v in sales:\n    total = total + v"},{"c":"total","r":"368.5"},{"c":"total = 0\nfor v in sales:\n    total += v"},{"c":"total","r":"368.5"}],"like":"Keeping a running tab rather than starting a new one each time.","k":"total = total + v"},{"g":"Loops","t":"Overwriting instead of adding","d":"Drop the total from the right-hand side and every pass throws away the last one. It runs, and only the final item survives.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"total = 0\nfor v in sales:\n    total = v"},{"c":"total","r":"81.0"},{"c":"sales[-1]","r":"81.0"}],"like":"Writing each day's takings on the same sticky note.","k":"total = v"},{"g":"Loops","t":"Counting with a condition","d":"An if inside the loop counts only what matches. Without it, every pass counts.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"busy = 0\nfor v in sales:\n    if v > 60:\n        busy = busy + 1"},{"c":"busy","r":"4"},{"c":"len(sales)","r":"5"}],"like":"Ticking only the rows that clear the threshold.","k":"if inside the loop"},{"g":"Loops","t":"Building a list as you go","d":"Start with an empty list outside the loop and add to it inside.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"big = []\nfor v in sales:\n    if v > 80:\n        big.append(v)"},{"c":"big","r":"[88.75, 95.25, 81.0]"}],"like":"An empty tray that fills as you sort the post.","k":".append()"},{"g":"Loops","t":"Counting into a dictionary","d":"Whatever is there, or zero the first time, plus one. The single most useful loop line in this course.","lines":[{"c":"blends = [\"House\", \"Decaf\", \"House\", \"Sumatra\", \"House\"]"},{"c":"counts = {}\nfor b in blends:\n    counts[b] = counts.get(b, 0) + 1"},{"c":"counts","r":"{'House': 3, 'Decaf': 1, 'Sumatra': 1}"}],"like":"A tally sheet that starts a new row the first time a name comes up.","k":"d.get(k, 0) + 1"},{"g":"Loops","t":"Why the tally needs .get()","d":"Square brackets read before they write. On the first item the key does not exist yet, so it raises.","lines":[{"c":"blends = [\"House\", \"Decaf\", \"House\"]"},{"c":"counts = {}"},{"c":"for b in blends:\n    counts[b] = counts[b] + 1","e":"KeyError: 'House'"}],"like":"Adding one to a line of the ledger that has not been written yet.","k":"KeyError"},{"g":"Loops","t":"Looping a dictionary","d":"Gives you the key and the value together, one pair at a time.","lines":[{"c":"beds = {\"House\": 12.50, \"Decaf\": 13.00}"},{"c":"for name, price in beds.items():\n    print(name, price)","r":"House 12.5 · Decaf 13.0"}],"like":"Reading a directory line by line, name and number at once.","k":".items()"},{"g":"Loops","t":"Counting positions","d":"Counts from 0 up to but not including its argument. Use it when you want the position, not the item.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"list(range(3))","r":"[0, 1, 2]"},{"c":"for i in range(3):\n    print(i, days[i])","r":"0 Mon · 1 Tue · 2 Wed"}],"like":"Numbering the seats rather than naming who is in them.","k":"range()"},{"g":"Loops","t":"Position and item together","d":"Hands you the position alongside the item, so you do not keep a counter yourself. start= sets where the numbering begins.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"for i, v in enumerate(sales[:3], start=1):\n    print(i, v)","r":"1 62.5 · 2 41.0 · 3 88.75"}],"like":"A numbered list that numbers itself.","k":"enumerate()"},{"g":"Loops","t":"The while loop","d":"Runs until its condition stops being true. Use it when the stopping point depends on what you have found so far — and make sure something inside moves you towards stopping.","lines":[{"c":"sales = [62.50, 41.00, 88.75, 95.25, 81.00]\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"]"},{"c":"ranked = sorted(sales, reverse=True)\nrunning = 0\nn = 0\nwhile running < sum(sales) / 2:\n    running += ranked[n]\n    n += 1"},{"c":"n","r":"3"},{"c":"running","r":"265.0"}],"like":"Taking the biggest boxes off the pallet until the pallet is half gone.","k":"while"},{"g":"Errors","t":"TypeError","d":"The operation does not fit the type. Joining text to a number, or asking a number for its length.","lines":[{"c":"\"Total: \" + 368.5","e":"TypeError: can only concatenate str (not \"float\") to str"},{"c":"len(368)","e":"TypeError: object of type 'int' has no len()"}],"like":"Trying to staple water."},{"g":"Errors","t":"ValueError","d":"The type is right but the content is not. float() on a string that has a dollar sign in it.","lines":[{"c":"float(\"$368.50\")","e":"ValueError: could not convert string to float: '$368.50'"},{"c":"int(\"26.0\")","e":"ValueError: invalid literal for int() with base 10: '26.0'"}],"like":"The form is the right form; the box has the wrong thing written in it."},{"g":"Errors","t":"KeyError","d":"You asked a dictionary for a key it does not have. Square brackets demand; .get() asks politely.","lines":[{"c":"price = {\"House\": 12.50}"},{"c":"price[\"Mocha\"]","e":"KeyError: 'Mocha'"},{"c":"price.get(\"Mocha\", 0.0)","r":"0.0"}],"like":"Looking up somebody who left last year."},{"g":"Errors","t":"IndexError","d":"You asked for a position that does not exist. Three items means positions 0, 1 and 2.","lines":[{"c":"blends = [\"House\", \"Sumatra\", \"Decaf\"]"},{"c":"blends[3]","e":"IndexError: list index out of range"},{"c":"blends[2]","r":"'Decaf'"}],"like":"Asking for row 4 of a three-row table."},{"g":"Errors","t":"NameError","d":"You used a name Python has never seen. Usually a typo, or a line that was never run.","lines":[{"c":"revenu","e":"NameError: name 'revenu' is not defined"},{"c":"revenue = 368.50"},{"c":"revenue","r":"368.5"}],"like":"Calling for somebody who does not work here."},{"g":"Errors","t":"AttributeError","d":"You asked for a method the type does not have. Not blocked — never there in the first place.","lines":[{"c":"order = (\"House\", 3)"},{"c":"order.append(1)","e":"AttributeError: 'tuple' object has no attribute 'append'"}],"like":"Looking for a gear stick in a car that has none."},{"g":"Errors","t":"IndentationError","d":"The indent is missing or inconsistent. Python reads indentation as grammar, so it stops.","lines":[{"c":"if 26 >= 20:\nteir = \"Gold\"","e":"IndentationError: expected an indented block after 'if' statement on line 1 (<string>, line 2)"}],"like":"A bullet point that is not under any heading."},{"g":"Errors","t":"Reading a traceback","d":"Read the last line first: it names the error and says what went wrong. The lines above it say where.","lines":[{"c":"int(\"26.0\")","e":"ValueError: invalid literal for int() with base 10: '26.0'"}],"like":"The diagnosis is at the bottom of the report, not the top."}]</script>
<script id="faultdata" type="application/json">[{"id":"revenue","tile":"revenue","halts":true,"label":"Revenue never arrives","kind":"ValueError","line":"revenue = float(\"$368.50\")","breaks":"The revenue tile never gets a value, and because the script dies here nothing below it is built either — average order, the daily chart, the blend table. One bad conversion takes out three quarters of the page.","why":"The dollar sign is a character, not a number. float() reads digits and one decimal point and nothing else. Money rarely arrives clean: card terminals, spreadsheets and exports all bake the symbol into the text.","ask":"Which line repairs it?","opts":[{"t":"float(\"$368.50\".replace(\"$\", \"\"))","ok":true,"why":"Takes the symbol out of the text first, then converts what is left. 368.5."},{"t":"int(\"$368.50\")","ok":false,"why":"Same ValueError, and int() would also refuse the decimal point even after the symbol went."},{"t":"float(\"$368.50\".strip())","ok":false,"why":".strip() only removes spaces from the ends. The dollar sign is in the middle of the text as far as it is concerned, so the ValueError stands."},{"t":"str(368.50)","ok":false,"why":"That gives you the text '368.5'. You would be back where you started, one type too far the wrong way."}],"err":"ValueError: could not convert string to float: '$368.50'","n":1},{"id":"bags","tile":"bags","halts":true,"label":"Bags sold is blank","kind":"ValueError","line":"bags = int(\"26.0\")","breaks":"The bags tile is empty and everything after it goes dark, including the loyalty tier, which is calculated from the bag count.","why":"int() refuses text containing a decimal point — even a harmless .0. It will not quietly throw away part of somebody's number.","ask":"Which line repairs it?","opts":[{"t":"float(\"26.0\")","ok":false,"why":"That works, but it gives 26.0 — a decimal where the tile wants a whole count of bags."},{"t":"int(float(\"26.0\"))","ok":true,"why":"Read it as a decimal first, then take the whole part deliberately. 26."},{"t":"round(\"26.0\")","ok":false,"why":"round() wants a number, not text. TypeError."},{"t":"int(\"26.0\".strip(\".\"))","ok":false,"why":"Strips dots from the ends only, so the text is still '26.0' and int() still refuses it."}],"err":"ValueError: invalid literal for int() with base 10: '26.0'","n":2},{"id":"avg","tile":"avg","halts":true,"label":"Average order crashes on a count","kind":"TypeError","line":"orders = 8\navg = round(revenue / len(orders), 2)","breaks":"The average-order tile dies, and so does everything under it. The chart, the tier badge and the blend table all vanish.","why":"len() asks a container how many things are inside it. 8 is not a container — it is already the answer.","ask":"Which line repairs it?","opts":[{"t":"avg = round(len(revenue) / orders, 2)","ok":false,"why":"Moves the same mistake onto revenue, which is also a number. Same TypeError."},{"t":"avg = revenue / orders","ok":false,"why":"The arithmetic is right and the tile is wrong: without round() it shows 46.0625, which is not a price anybody quotes."},{"t":"avg = round(revenue / orders, 2)","ok":true,"why":"orders is already the count. 368.50 / 8 = 46.0625, rounded to 46.06."},{"t":"avg = round(revenue / len(str(orders)), 2)","ok":false,"why":"len('8') is 1, so this divides by one and reports the whole week's revenue as the average order."}],"err":"TypeError: object of type 'int' has no len()","n":3},{"id":"best","tile":"best","halts":false,"label":"Best blend says Decaf","kind":"runs — wrong answer","line":"counts = {\"House\": 11, \"Sumatra\": 9, \"Decaf\": 6}\nbest = sorted(counts)[0]","breaks":"Nothing errors. The tile fills in confidently with Decaf — the blend that sold least. Nadia orders more Decaf next week.","why":"sorted() on a dictionary sorts the keys alphabetically, and Decaf comes before House and Sumatra. The counts were never consulted.","ask":"Which line repairs it?","opts":[{"t":"best = max(counts)","ok":false,"why":"max() on a dictio
