<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Activities</title>
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F5F5F7; --card:#FFFFFF; --fill:#F5F5F7; --fill-2:#EBEBF0;
  --text:#1D1D1F; --text-2:#6E6E73; --text-3:#86868B;
  --sep:#D2D2D7; --sep-2:#E8E8ED;
  --blue:#0066CC; --blue-solid:#0071E3; --green:#1D7F3C; --red:#C8102E; --orange:#B25000;
  --blue-bg:#EDF4FD; --green-bg:#EAF6EE; --red-bg:#FCEDEF; --orange-bg:#FDF3E8;
  --thumb:#FFFFFF; --r:18px; --r-sm:12px;
  --shadow:0 4px 20px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 18px 46px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05);
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-2:#101012; --card:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C;
    --thumb:#48484A;
    --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#8E8E93;
    --sep:#38383A; --sep-2:#2C2C2E;
    --blue:#2997FF; --blue-solid:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
    --blue-bg:#0D2136; --green-bg:#0E2A18; --red-bg:#2E1113; --orange-bg:#2C1E06;
    --shadow:0 4px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 18px 46px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#101012; --card:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C;
    --thumb:#48484A;
  --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#8E8E93;
  --sep:#38383A; --sep-2:#2C2C2E;
  --blue:#2997FF; --blue-solid:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --blue-bg:#0D2136; --green-bg:#0E2A18; --red-bg:#2E1113; --orange-bg:#2C1E06;
  --shadow:0 4px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 18px 46px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0; -webkit-text-size-adjust:100%}
html{min-height:100%}
button{touch-action:manipulation}
body{background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
code,pre,.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0}
button,input,textarea{font-family:inherit; letter-spacing:inherit}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.022em}

.wrap{max-width:1120px; margin:0 auto; padding:34px 22px 60px; min-height:100vh;
  min-height:100dvh; display:flex; flex-direction:column}
.tabbody{margin-block:auto; width:100%}
@media (max-width:640px){ .wrap{padding:18px 16px 40px} }

.topline{display:flex; align-items:center; justify-content:space-between; gap:18px;
  flex-wrap:wrap; margin-bottom:30px}
.masthead{margin-bottom:30px}
h1{font-size:44px; line-height:1.08; letter-spacing:-.03em}
@media (max-width:640px){ h1{font-size:32px} }
.lede{color:var(--text-2); max-width:62ch; font-size:18px; margin:14px 0 0; line-height:1.45}
@media (max-width:640px){ .lede{font-size:16px} }

.ghostpill{border:1px solid var(--sep); background:transparent; color:var(--text-2);
  border-radius:980px; padding:7px 15px; font-size:13px; cursor:pointer; font-weight:500;
  transition:background .2s var(--ease), color .2s var(--ease)}
.ghostpill:hover{background:var(--fill); color:var(--text)}

/* segmented control */
.seg-wrap{margin:0}
.segmented{display:inline-flex; position:relative; background:var(--fill); border-radius:11px; padding:3px;
  gap:0}
.segmented button{position:relative; z-index:1; appearance:none; border:none; background:none;
  padding:8px 20px; font-size:14px; font-weight:500; color:var(--text-2); cursor:pointer;
  border-radius:9px; transition:color .25s var(--ease)}
.segmented button[aria-selected="true"]{color:var(--text); font-weight:600}
.segmented .thumb{position:absolute; top:3px; bottom:3px; background:var(--thumb); border-radius:9px;
  box-shadow:0 2px 6px rgba(0,0,0,.09), 0 0 0 .5px rgba(0,0,0,.04);
  transition:left .34s var(--ease), width .34s var(--ease)}

/* generic surfaces */
.card{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.card-h{padding:15px 20px 13px; border-bottom:1px solid var(--sep-2);
  display:flex; align-items:center; justify-content:space-between; gap:12px}
.card-h .t{font-size:15px; font-weight:600}
.card-h .n{font-size:14px; color:var(--text-3); font-variant-numeric:tabular-nums}
.card-b{padding:20px}

.btn{appearance:none; border:none; border-radius:980px; padding:11px 22px; font-size:15px;
  font-weight:500; cursor:pointer; background:var(--blue-solid); color:#fff;
  transition:transform .18s var(--ease), opacity .2s var(--ease), background .2s var(--ease)}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35; cursor:default; transform:none}
.btn.sub{background:var(--fill); color:var(--text)}
.btn.sub:hover{background:var(--fill-2); opacity:1}
.btn.go{background:var(--green); color:#fff}
.btn.sm{padding:8px 16px; font-size:13.5px}
.btn:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

input[type=text]{width:100%; font-size:15px; padding:11px 14px; border:1px solid var(--sep);
  border-radius:var(--r-sm); background:var(--bg); color:var(--text); transition:border-color .2s}
input[type=text]:focus{outline:none; border-color:var(--blue-solid); box-shadow:0 0 0 3px var(--blue-bg)}
.mono-in{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:14px; letter-spacing:0}

.hint{font-size:13px; color:var(--text-3); line-height:1.5}

@keyframes riseIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.rise{animation:riseIn .45s var(--ease) both}

/* ---------- tab 1 ---------- */
.layout{display:grid; grid-template-columns:296px 1fr; gap:24px; align-items:start}
@media (max-width:920px){ .layout{grid-template-columns:1fr} }
@media (max-width:640px){
  h1{font-size:28px}
  .dash{padding:14px}
  .tile .val{font-size:21px}
  .bars{height:80px}
  .drow{font-size:13px; padding:10px 12px}
  .inrow input{flex:1 1 100%}
  .inrow .btn{flex:1 1 auto}
  .topline{margin-bottom:20px}
  .segmented button{padding:8px 14px; font-size:13.5px}
}

.faults{list-style:none; margin:0; padding:6px}
.fault{display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:none;
  background:none; color:var(--text); padding:11px 12px; border-radius:var(--r-sm); cursor:pointer;
  transition:background .2s var(--ease)}
.fault:hover{background:var(--fill)}
.fault[aria-pressed="true"]{background:var(--blue-bg)}
.fault .num{width:22px; height:22px; flex:none; border-radius:50%; background:var(--fill-2);
  color:var(--text-2); font-size:11.5px; font-weight:600; display:flex; align-items:center;
  justify-content:center; font-variant-numeric:tabular-nums; transition:all .25s var(--ease)}
.fault[aria-pressed="true"] .num{background:var(--blue-solid); color:#fff}
.fault.done .num{background:var(--green); color:#fff}
.fault .txt{min-width:0}
.fault .lab{font-size:14px; line-height:1.3; display:block}
.fault .kind{font-size:12px; color:var(--text-3); display:block; margin-top:2px}
.fault:focus-visible{outline:2px solid var(--blue); outline-offset:-2px}

.bar{height:4px; border-radius:99px; background:var(--fill-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--green); border-radius:99px;
  transition:width .5s var(--ease)}

.screen{background:var(--card); border-radius:var(--r); box-shadow:var(--shadow-lg); overflow:hidden}
.chrome{display:flex; align-items:center; gap:7px; padding:12px 18px; border-bottom:1px solid var(--sep-2)}
.tl{width:11px;height:11px;border-radius:50%;background:var(--sep);flex:none}
.fname{font-size:13px; color:var(--text-3); margin-left:8px; font-family:ui-monospace,Menlo,monospace;
  letter-spacing:0; transition:color .3s}
.fname.bad{color:var(--red)}

.dash{padding:24px}
@media (max-width:640px){ .dash{padding:18px} }
.dash-h{display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap;
  margin-bottom:20px}
.shopname{font-size:24px; font-weight:600; letter-spacing:-.022em; transition:color .3s}
.shopname.bad{color:var(--red)} .shopname.off{color:var(--text-3)}
.week{font-size:13.5px; color:var(--text-3)}

.tiles{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px}
@media (max-width:820px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tile{background:var(--fill); border-radius:var(--r-sm); padding:15px 16px;
  transition:background .3s var(--ease), opacity .3s var(--ease)}
.tile.lie{background:var(--red-bg)}
.tile.dead{opacity:.32}
.tile .lab{font-size:13px; color:var(--text-2)}
.tile .val{font-size:24px; font-weight:600; letter-spacing:-.025em; margin-top:4px;
  font-variant-numeric:tabular-nums; word-break:break-word; line-height:1.15}
.tile.lie .val{color:var(--red)}
.tile .sub{font-size:12.5px; color:var(--text-3); margin-top:3px}
.tile.lie .sub{color:var(--red)}

.chartbox{margin-top:12px; background:var(--fill); border-radius:var(--r-sm); padding:16px 18px 12px;
  transition:opacity .3s var(--ease)}
.chartbox.dead{opacity:.32}
.chartbox .ct{font-size:13px; color:var(--text-2); margin-bottom:14px}
.bars{display:flex; align-items:flex-end; gap:12px; height:104px}
.bcol{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px;
  height:100%}
.bcol .b{width:100%; background:var(--blue-solid); border-radius:6px 6px 2px 2px; min-height:3px;
  transition:height .45s var(--ease), background .3s}
.bcol.dead .b{background:var(--sep)}
.bcol .n{font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums}
.bcol .d{font-size:12px; color:var(--text-2)}

.rowbox{margin-top:12px; background:var(--fill); border-radius:var(--r-sm); overflow:hidden}
.drow{display:flex; justify-content:space-between; gap:12px; padding:12px 16px; font-size:14px;
  border-bottom:1px solid var(--sep-2); transition:background .3s var(--ease), opacity .3s var(--ease)}
.drow:last-child{border-bottom:none}
.drow .k{color:var(--text-2)}
.drow .v{font-variant-numeric:tabular-nums; font-weight:500}
.drow.lie{background:var(--red-bg)}
.drow.lie .k,.drow.lie .v{color:var(--red)}
.drow.dead{opacity:.32}

.banner{margin-top:16px; border-radius:var(--r-sm); padding:14px 16px; animation:riseIn .4s var(--ease) both}
.banner.bad{background:var(--red-bg)}
.banner.ok{background:var(--green-bg)}
.banner.warn{background:var(--orange-bg)}
.banner.warn .h{color:var(--orange)}
.banner.warn pre{color:var(--orange)}
.banner .h{font-size:13px; font-weight:600; color:var(--red)}
.banner pre{margin:7px 0 0; font-size:12.5px; color:var(--red); white-space:pre-wrap;
  word-break:break-word; line-height:1.5}
.banner.ok p{margin:0; font-size:14px; color:var(--text-2)}

.explain{margin-top:24px; display:grid; gap:14px}
.srcbox .l{font-size:13px; color:var(--text-2); margin-bottom:8px}
pre.code{margin:0; background:var(--fill); border-radius:var(--r-sm); padding:16px 18px;
  font-size:13.5px; line-height:1.65; overflow-x:auto; white-space:pre}
.note{border-radius:var(--r-sm); padding:16px 18px}
.note .h{font-size:13px; font-weight:600; margin-bottom:5px}
.note p{margin:0; font-size:15px; line-height:1.55}
.note.breaks{background:var(--red-bg)} .note.breaks .h{color:var(--red)}
.note.why{background:var(--orange-bg)} .note.why .h{color:var(--orange)}
.note.fix{background:var(--green-bg)} .note.fix .h{color:var(--green)}

.repair{background:var(--fill); border-radius:var(--r); padding:20px}
.repair .btn.sub{background:var(--card)}
.repair .btn.sub:hover{background:var(--fill-2)}
.repair .l{font-size:14px; font-weight:600; margin-bottom:10px; display:block}
.inrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.inrow input{flex:1 1 280px}
.verdict{margin-top:11px; font-size:14px; animation:fadeIn .3s both}
.verdict.no{color:var(--red)}
.verdict.yes{color:var(--green); font-weight:500}
.showme{margin-top:11px; font-size:14px; color:var(--text-2)}
.showme code{background:var(--card); border-radius:7px; padding:3px 8px; font-size:13px}
.blank{padding:44px 20px; text-align:center; color:var(--text-3); font-size:15px}

/* ---------- tab 2 ---------- */
.deckwrap{display:grid; grid-template-columns:1fr 268px; gap:28px; align-items:start}
@media (max-width:920px){ .deckwrap{grid-template-columns:1fr} }

.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px}
@media (max-width:760px){
  .chips{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
    margin:0 -16px 16px; padding:2px 16px 6px; scroll-snap-type:x proximity}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none; scroll-snap-align:start}
}
.chip{appearance:none; border:1px solid var(--sep); background:transparent; color:var(--text-2);
  border-radius:980px; padding:7px 15px; font-size:13.5px; cursor:pointer; font-weight:500;
  transition:all .22s var(--ease)}
.chip:hover{background:var(--fill); color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text); color:var(--bg); border-color:var(--text)}

.stage{position:relative; perspective:1800px}
.stack{position:absolute; inset:0; border-radius:22px; background:#14663A; box-shadow:var(--shadow)}
.stack.s1{transform:translateY(11px) scale(.965); opacity:.55}
.stack.s2{transform:translateY(22px) scale(.93); opacity:.3}

.swap{position:relative; width:100%}
.flip{display:grid; width:100%; min-height:432px; touch-action:pan-y; transform-style:preserve-3d;
  transition:transform .62s var(--ease); cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1; position:relative; backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background:var(--card); border-radius:22px; box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column}
.face > *{flex:none}
.face.back{transform:rotateY(180deg) translateZ(0)}

.front{align-items:center; justify-content:center; text-align:center; padding:40px 32px; gap:22px;
  background:linear-gradient(158deg, #23955A 0%, #14663A 65%); color:#FFFFFF;
  box-shadow:0 22px 50px rgba(15,70,40,.26), 0 2px 8px rgba(0,0,0,.10)}
.front .grp{color:rgba(255,255,255,.80)}
.front .tap{color:rgba(255,255,255,.62)}
.front .badge{background:rgba(255,255,255,.17); color:#FFFFFF}
.grp{font-size:13px; font-weight:600; color:var(--blue)}
.term{font-size:46px; font-weight:600; letter-spacing:-.03em; line-height:1.08; word-break:break-word}
@media (max-width:640px){ .term{font-size:34px} }
.term .mono{font-size:.88em}
.tap{font-size:13.5px; color:var(--text-3)}
.badge{display:inline-block; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  letter-spacing:0; font-size:17px; background:var(--fill); color:var(--text-2);
  border-radius:10px; padding:7px 15px; white-space:pre}
.back .badge{font-size:14px; padding:5px 11px; margin-top:6px}

.back{padding:30px 32px 32px; gap:0}
@media (max-width:640px){
  .back,.front{padding:24px 20px}
  .flip{min-height:360px}
  .back .term{font-size:24px}
  .back .defn{font-size:16px; margin:12px 0 16px}
  .back pre.code{font-size:12.5px; padding:13px 14px}
  .like{font-size:14px}
  .stack.s1{transform:translateY(8px) scale(.97)}
  .stack.s2{transform:translateY(16px) scale(.945)}
}
.back .term{font-size:29px; text-align:left}
.back .defn{font-size:17.5px; line-height:1.5; color:var(--text); margin:14px 0 20px; max-width:56ch}
.back pre.code{background:var(--fill); font-size:13.5px; line-height:1.75}
.res{color:var(--green)}
.errline{color:var(--red)}
.like{margin-top:20px; padding-top:18px; border-top:1px solid var(--sep-2); font-size:15px;
  color:var(--text-2); line-height:1.55}
.like b{color:var(--text); font-weight:600}

@keyframes inFromRight{from{opacity:0; transform:translateX(34px) scale(.97)} to{opacity:1; transform:none}}
@keyframes inFromLeft{from{opacity:0; transform:translateX(-34px) scale(.97)} to{opacity:1; transform:none}}
@keyframes outLeft{to{opacity:0; transform:translateX(-120px) rotate(-7deg) scale(.9)}}
@keyframes outRight{to{opacity:0; transform:translateX(120px) rotate(7deg) scale(.9)}}
.enter{animation:inFromRight .42s var(--ease) both}
.enterL{animation:inFromLeft .42s var(--ease) both}
.leaveL{animation:outLeft .38s var(--ease) both}
.leaveR{animation:outRight .38s var(--ease) both}

.deckrow{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center}
@media (max-width:640px){ .deckrow{grid-template-columns:minmax(0,1fr); gap:14px} }
.arrow{appearance:none; border:1px solid var(--sep); background:var(--card); color:var(--text);
  width:46px; height:46px; border-radius:50%; cursor:pointer; font-size:19px; line-height:1;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  transition:transform .18s var(--ease), background .2s var(--ease)}
.arrow:hover{background:var(--fill)}
.arrow:active{transform:scale(.92)}
.arrow:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
@media (max-width:640px){
  .arrowbar{display:flex; gap:12px; justify-content:center}
  .arrow{width:44px; height:44px}
}
.deckctrl{display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; align-items:center; justify-content:center}
.mobonly{display:none}
@media (max-width:640px){ .deskonly{display:none} .mobonly{display:flex} }
.keyhint{font-size:12.5px; color:var(--text-3); margin-top:26px}
.kbd{display:inline-block; background:var(--fill); border-radius:5px; padding:1px 6px; font-size:11.5px;
  font-family:ui-monospace,Menlo,monospace; border:1px solid var(--sep-2)}

.ringwrap{display:flex; align-items:center; gap:16px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:7; stroke-linecap:round}
.ring .track{stroke:var(--fill-2)}
.ring .fill{stroke:var(--green); transition:stroke-dashoffset .55s var(--ease)}
.ringnum{font-size:26px; font-weight:600; letter-spacing:-.025em; font-variant-numeric:tabular-nums}
.ringsub{font-size:13px; color:var(--text-3)}


.done{align-items:center; justify-content:center; text-align:center; padding:48px 32px; gap:18px}


@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
